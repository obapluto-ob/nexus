<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Email Verification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0e1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 80%, rgba(0,255,255,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(0,128,255,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(128,0,255,0.05) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(0,255,255,0.6);
            border-radius: 50%;
            animation: float-particle 15s infinite linear;
        }
        
        @keyframes float-particle {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(100px); opacity: 0; }
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .header { 
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            backdrop-filter: blur(30px); 
            border: 1px solid rgba(255,255,255,0.2);
            color: white; 
            padding: 50px; 
            text-align: center; 
            margin-bottom: 40px; 
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0,255,255,0.1), transparent, rgba(0,128,255,0.1), transparent);
            animation: rotate 15s linear infinite;
        }
        
        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00ffff, #0080ff, #8000ff, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 30px rgba(0,255,255,0.5);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.8;
            position: relative;
            z-index: 1;
        }
        
        .card { 
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 35px; 
            margin-bottom: 30px; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: left 0.8s;
        }
        
        .card:hover::before {
            left: 100%;
        }
        
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 35px 70px rgba(0,255,255,0.2), inset 0 1px 0 rgba(255,255,255,0.2);
            border-color: rgba(0,255,255,0.3);
        }
        
        .btn { 
            background: linear-gradient(135deg, #00ffff, #0080ff, #8000ff);
            color: white; 
            padding: 16px 32px; 
            border: none; 
            border-radius: 16px; 
            cursor: pointer; 
            margin: 10px; 
            font-weight: 600; 
            font-size: 14px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover { 
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0,255,255,0.4);
            background: linear-gradient(135deg, #00ffff, #0080ff, #ff00ff);
        }
        
        .btn:active {
            transform: translateY(-1px) scale(1.02);
        }
        
        .btn-success { 
            background: linear-gradient(135deg, #00ff88, #00cc66);
        }
        
        .btn-success:hover { 
            box-shadow: 0 10px 25px rgba(0,255,136,0.3);
        }
        
        .form-group { margin-bottom: 25px; }
        
        .form-group label { 
            display: block; 
            margin-bottom: 10px; 
            font-weight: 600; 
            color: #ffffff;
            font-size: 14px;
        }
        
        .form-group input, .form-group textarea, .form-group select { 
            width: 100%; 
            padding: 15px; 
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 12px; 
            font-size: 14px; 
            color: #ffffff;
            transition: all 0.3s ease;
        }
        
        .form-group select option {
            background: #2d2d2d;
            color: #ffffff;
        }
        
        .form-group input::placeholder, .form-group textarea::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .form-group input:focus, .form-group textarea:focus { 
            border-color: #00ffff; 
            outline: none;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }
        
        .hidden { display: none; }
        
        .success { 
            color: #00ff88; 
            font-weight: bold; 
            padding: 15px; 
            background: rgba(0,255,136,0.1); 
            border: 1px solid rgba(0,255,136,0.3);
            border-radius: 12px; 
            margin: 15px 0; 
        }
        
        .error { 
            color: #ff4757; 
            font-weight: bold; 
            padding: 15px; 
            background: rgba(255,71,87,0.1); 
            border: 1px solid rgba(255,71,87,0.3);
            border-radius: 12px; 
            margin: 15px 0; 
        }
        
        .upload-area { 
            border: 2px dashed rgba(255,255,255,0.3); 
            border-radius: 15px; 
            padding: 50px; 
            text-align: center; 
            background: rgba(255,255,255,0.02); 
            transition: all 0.3s ease;
            position: relative;
        }
        
        .upload-area:hover { 
            border-color: #00ffff; 
            background: rgba(0,255,255,0.05);
            transform: scale(1.02);
        }
        
        .upload-area.dragover { 
            border-color: #00ffff; 
            background: rgba(0,255,255,0.1);
            box-shadow: 0 0 30px rgba(0,255,255,0.3);
        }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 25px; 
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stat-card { 
            background: linear-gradient(145deg, rgba(0,255,255,0.15), rgba(0,128,255,0.1), rgba(128,0,255,0.05)); 
            border: 1px solid rgba(255,255,255,0.2);
            color: white; 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00ffff, #0080ff, #8000ff);
            transform: scaleX(0);
            transition: transform 0.4s;
        }
        
        .stat-card:hover::before {
            transform: scaleX(1);
        }
        
        .stat-card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,255,255,0.3);
            background: linear-gradient(145deg, rgba(0,255,255,0.2), rgba(0,128,255,0.15), rgba(128,0,255,0.1));
        }
        
        .stat-number { 
            font-size: 2.5em; 
            font-weight: 700;
            background: linear-gradient(135deg, #00ffff, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .email-results { 
            max-height: 400px; 
            overflow-y: auto; 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(1deg); }
            66% { transform: translateY(10px) rotate(-1deg); }
        }
        
        .email-item {
            padding: 15px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .email-item::before {
            content: '';
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .email-item:hover::before {
            left: 100%;
        }
        
        .email-item:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(5px);
        }
        
        .email-valid { background: rgba(0,255,136,0.1); }
        .email-invalid { background: rgba(255,71,87,0.1); }
        .email-risky { background: rgba(255,193,7,0.1); }
        
        .progress-bar { 
            width: 100%; 
            height: 10px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 5px; 
            overflow: hidden; 
            margin: 15px 0; 
        }
        
        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #00ffff, #00ff88); 
            transition: width 0.3s ease;
        }
        
        .tabs { 
            display: flex; 
            margin-bottom: 30px; 
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border-radius: 16px; 
            padding: 8px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .tabs::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,255,255,0.5), transparent);
            animation: scan 3s infinite;
        }
        
        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .tab { 
            padding: 15px 30px; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }
        
        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .tab:hover::before {
            left: 100%;
        }
        
        .tab.active { 
            background: linear-gradient(135deg, #00ffff, #0080ff, #8000ff); 
            color: white;
            box-shadow: 0 8px 25px rgba(0,255,255,0.4);
            transform: translateY(-2px);
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .tech-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-right: 8px;
            background: linear-gradient(135deg, #00ffff, #0080ff);
            border-radius: 3px;
        }
        
        .terminal-container {
            background: #1a1a1a;
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 8px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 20px rgba(0,255,255,0.1);
        }
        
        .terminal-header {
            background: #2d2d2d;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0,255,255,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px 8px 0 0;
        }
        
        .terminal-title {
            color: #00ffff;
            font-size: 12px;
            font-weight: bold;
        }
        
        .terminal-controls {
            display: flex;
            gap: 6px;
        }
        
        .control-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .control-dot.red { background: #ff5f56; }
        .control-dot.yellow { background: #ffbd2e; }
        .control-dot.green { background: #27ca3f; }
        
        .terminal-body {
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            background: #0a0a0a;
            color: #00ff00;
            font-size: 13px;
            line-height: 1.4;
        }
        
        .terminal-line {
            margin-bottom: 2px;
            animation: typewriter 0.5s ease-in;
        }
        
        .terminal-line.loading {
            color: #ffa502;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        .terminal-line.success { color: #00ff88; }
        .terminal-line.error { color: #ff4757; }
        .terminal-line.warning { color: #ffa502; }
        .terminal-line.info { color: #00ffff; }
        
        @keyframes typewriter {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .cursor {
            display: inline-block;
            background: #00ff00;
            width: 8px;
            height: 14px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .content-options {
            margin-bottom: 10px;
        }
        
        .content-options select {
            width: 200px;
            padding: 8px;
            background: #2d2d2d;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #ffffff;
        }
        
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .header { padding: 20px; }
            .header h1 { font-size: 2rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .card { padding: 20px; }
            .btn { padding: 12px 20px; margin: 5px; }
            .tabs { flex-direction: column; }
            .tab { margin-bottom: 5px; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>
    
    <div class="header">
        <h1>NEXUS EMAIL VERIFICATION</h1>
        <p>Advanced Email Intelligence • Real-time Verification • Campaign Automation</p>
    </div>

    <div class="container">
        <!-- Copy all HTML content from webapp.py here -->
        <!-- This is just the structure - you'll need to copy the full HTML -->
        <div class="card">
            <h2>🚀 VERCEL DEPLOYMENT READY!</h2>
            <p>Frontend deployed successfully. Update API_BASE to your Render backend URL.</p>
        </div>
    </div>

    <script>
        // IMPORTANT: Update this to your Render backend URL
        const API_BASE = 'https://nexus-0ajq.onrender.com';
        
        // Keep backend alive
        setInterval(() => {
            fetch(`${API_BASE}/ping`).catch(() => {});
        }, 14 * 60 * 1000); // Ping every 14 minutes
        
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }
        
        window.addEventListener('load', createParticles);
        
        // Copy all JavaScript from webapp.py here
    </script>
</body>
</html>
